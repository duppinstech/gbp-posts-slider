name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' gbp-posts-slider.php | tr -d '\r')
          constant=$(sed -n "s/^define( 'GBP_SLIDER_VERSION', '\([^']*\)' );/\1/p" gbp-posts-slider.php | tr -d '\r')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r')
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag does not match the plugin header, GBP_SLIDER_VERSION, and readme Stable tag."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Lint plugin PHP
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: bash bin/build-zip.sh

      - name: Write release notes
        run: bash bin/release-notes.sh "${GITHUB_REF_NAME#v}" gbp-posts-slider.php release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" gbp-posts-slider.zip \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
